[package]
name = "mib-rs"
version = "0.1.0"
edition = "2024"
description = "SNMP MIB parser and resolver"
license = "MIT"
rust-version = "1.88"

[[bin]]
name = "mib-rs"
path = "src/bin/mib-rs.rs"

[dependencies]
thiserror = "2"
tracing = "0.1"
rayon = "1.11"
smallvec = { version = "1.15", features = ["union"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
petgraph = "0.8"
walkdir = "2"
dashmap = "6"
dirs = "6"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "smallvec/serde"]

[dev-dependencies]
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
